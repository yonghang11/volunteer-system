server:
  port: 8080

spring:
  application:
    name: volunteer
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/volunteer_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:12345677}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

app:
  token-secret: ${TOKEN_SECRET:volunteer-system-2026}
  token-hours: 12
  # 上传目录（默认相对于 user.dir，此处用绝对路径避免 Tomcat 临时目录问题）
  upload-dir: ${UPLOAD_DIR:${user.dir}/uploads}

logging:
  level:
    com.campus.volunteer: info
